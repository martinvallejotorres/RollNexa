spring:
  application:
    name: rollnexa
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rollnexa}
    username: ${POSTGRES_USER:rollnexa}
    password: ${POSTGRES_PASSWORD:rollnexa}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
app:
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
